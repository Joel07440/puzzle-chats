<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle des chats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Fredoka", "Comic Sans MS", sans-serif;
      background: #fff6ec;
      color: #4a3428;
      min-height: 100vh;
      -webkit-user-select: none;
      user-select: none;
    }
    .ecran { display: none; max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; text-align: center; }
    .ecran.visible { display: block; }

    h1 { font-size: clamp(2em, 7vw, 3em); margin: 10px 0 4px; color: #e0703a; }
    h2 { font-size: 1.6em; margin: 6px 0 18px; }
    .sous-titre { font-size: 1.15em; margin: 0 0 30px; opacity: 0.8; }

    /* --- Choix du niveau --- */
    .niveaux { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .niveau {
      background: white; border: 4px solid transparent; border-radius: 24px;
      padding: 26px 20px; cursor: pointer; font-family: inherit; color: inherit;
      box-shadow: 0 6px 0 #f0d9c4; transition: transform 0.15s;
    }
    .niveau:hover { transform: translateY(-4px); border-color: #ffb27a; }
    .niveau .emoji { font-size: 3.5em; display: block; }
    .niveau strong { font-size: 1.6em; display: block; margin: 6px 0; }
    .niveau span { opacity: 0.75; font-size: 1.05em; }

    /* --- Galerie d'images --- */
    .galerie { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .vignette {
      background: white; border-radius: 18px; padding: 8px 8px 10px; cursor: pointer;
      box-shadow: 0 5px 0 #f0d9c4; border: 3px solid transparent; transition: transform 0.15s;
    }
    .vignette:hover { transform: translateY(-3px) rotate(-1deg); border-color: #ffb27a; }
    .vignette img { width: 100%; aspect-ratio: 1; border-radius: 12px; display: block; }
    .vignette p { margin: 8px 0 0; font-weight: 600; }
    .vignette .record { font-size: 0.85em; opacity: 0.65; font-weight: 400; }
    .vignette.photo {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 180px; border: 3px dashed #ffb27a; box-shadow: none; background: #fffaf5;
    }
    .vignette.photo .emoji { font-size: 3em; }

    /* --- Barre du jeu --- */
    .barre {
      display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 14px; font-size: 1.15em;
    }
    .compteur { background: white; border-radius: 14px; padding: 8px 16px; box-shadow: 0 3px 0 #f0d9c4; }

    /* --- Plateau --- */
    .plateau-zone { position: relative; width: min(92vw, 520px); margin: 0 auto; }
    .plateau {
      display: grid; gap: 3px; width: 100%; aspect-ratio: 1;
      background: #e9cfb8; padding: 3px; border-radius: 16px;
      touch-action: none;
    }
    .piece {
      background-repeat: no-repeat; border-radius: 5px; cursor: grab;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .piece.choisie { transform: scale(0.9); box-shadow: 0 0 0 4px #ff8a3d; z-index: 2; }
    .piece.cible { box-shadow: 0 0 0 4px #5fb4ff; }
    .piece.bien { box-shadow: inset 0 0 0 3px rgba(80, 200, 110, 0.9); }
    .modele {
      position: absolute; inset: 0; border-radius: 16px; background-size: cover;
      display: none; z-index: 5; box-shadow: 0 0 0 3px #e9cfb8;
    }
    .modele.visible { display: block; }

    .aide { margin: 12px 0 0; opacity: 0.7; }

    /* --- Boutons --- */
    .boutons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    button.btn {
      font-family: inherit; font-size: 1.05em; font-weight: 600; border: none; cursor: pointer;
      padding: 12px 20px; border-radius: 14px; background: #ff8a3d; color: white;
      box-shadow: 0 4px 0 #d9682a;
    }
    button.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d9682a; }
    button.btn.doux { background: white; color: #4a3428; box-shadow: 0 4px 0 #f0d9c4; }
    .retour { position: absolute; left: 0; top: 0; }
    .entete { position: relative; }

    /* --- Victoire --- */
    .victoire {
      position: fixed; inset: 0; background: rgba(74, 52, 40, 0.55);
      display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px;
    }
    .victoire.visible { display: flex; }
    .boite {
      background: white; border-radius: 28px; padding: 26px 24px; max-width: 420px; width: 100%;
      animation: pop 0.4s ease-out;
    }
    .boite img { width: 70%; border-radius: 16px; margin: 6px 0; }
    .etoiles { font-size: 2.6em; letter-spacing: 6px; }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .confetti { position: fixed; top: -40px; font-size: 26px; pointer-events: none; z-index: 30;
                animation: tombe linear forwards; }
    @keyframes tombe { to { transform: translateY(110vh) rotate(540deg); } }
  </style>
</head>
<body>

  <!-- ÉCRAN 1 : choix du niveau -->
  <div class="ecran visible" id="ecran-accueil">
    <h1>🐱 Puzzle des chats 🐱</h1>
    <p class="sous-titre">Remets les morceaux dans l'ordre pour retrouver l'image !</p>
    <div class="niveaux">
      <button class="niveau" data-niveau="enfant">
        <span class="emoji">🧒</span>
        <strong>Enfant</strong>
        <span>9 pièces<br>Les pièces bien placées s'allument en vert</span>
      </button>
      <button class="niveau" data-niveau="adulte">
        <span class="emoji">🧑</span>
        <strong>Adulte</strong>
        <span>25 pièces<br>Sans aide, à toi de jouer !</span>
      </button>
    </div>
  </div>

  <!-- ÉCRAN 2 : choix de l'image -->
  <div class="ecran" id="ecran-galerie">
    <div class="entete">
      <button class="btn doux retour" id="retour-accueil">← Niveau</button>
      <h2>Choisis ton chat</h2>
    </div>
    <div class="galerie" id="galerie"></div>
    <input type="file" id="fichier-photo" accept="image/*" hidden>
  </div>

  <!-- ÉCRAN 3 : le jeu -->
  <div class="ecran" id="ecran-jeu">
    <div class="barre">
      <span class="compteur">🔁 Coups : <strong id="coups">0</strong></span>
      <span class="compteur">⏱️ <strong id="temps">0:00</strong></span>
    </div>
    <div class="plateau-zone">
      <div class="plateau" id="plateau"></div>
      <div class="modele" id="modele"></div>
    </div>
    <p class="aide">Touche deux pièces pour les échanger, ou fais glisser une pièce sur une autre.</p>
    <div class="boutons">
      <button class="btn doux" id="btn-modele">👀 Voir le modèle</button>
      <button class="btn doux" id="btn-melanger">🔀 Mélanger</button>
      <button class="btn doux" id="btn-galerie">🖼️ Autre image</button>
    </div>
  </div>

  <!-- FENÊTRE DE VICTOIRE -->
  <div class="victoire" id="victoire">
    <div class="boite">
      <h2>Bravo ! 🎉</h2>
      <div class="etoiles" id="etoiles"></div>
      <img id="image-gagnee" alt="">
      <p id="bilan"></p>
      <div class="boutons">
        <button class="btn" id="btn-rejouer">Rejouer</button>
        <button class="btn doux" id="btn-autre">Autre image</button>
      </div>
    </div>
  </div>

<script>
/* =========================================================
   1. LES DESSINS DE CHATS (images dessinées en SVG)
   ========================================================= */

// Petit générateur de hasard "fixe" : les décors sont toujours identiques
function hasard(graine) {
  return () => (graine = (graine * 16807) % 2147483647) / 2147483647;
}

// Répartit des petits motifs (cœurs, étoiles…) sur tout le fond
function semer(forme, graine, taille) {
  const h = hasard(graine);
  let s = "";
  for (let i = 0; i < 7; i++) {
    for (let j = 0; j < 7; j++) {
      const x = i * 60 + 10 + h() * 40;
      const y = j * 60 + 10 + h() * 40;
      s += forme(x, y, taille * (0.7 + h() * 0.6));
    }
  }
  return s;
}
const rond   = c => (x, y, t) => `<circle cx="${x}" cy="${y}" r="${t}" fill="${c}"/>`;
const coeur  = c => (x, y, t) => `<path fill="${c}" d="M${x} ${y + t * 0.3} C${x} ${y - t * 0.3} ${x - t} ${y - t * 0.3} ${x - t} ${y + t * 0.25} C${x - t} ${y + t * 0.65} ${x} ${y + t * 0.9} ${x} ${y + t * 1.1} C${x} ${y + t * 0.9} ${x + t} ${y + t * 0.65} ${x + t} ${y + t * 0.25} C${x + t} ${y - t * 0.3} ${x} ${y - t * 0.3} ${x} ${y + t * 0.3}Z"/>`;
const etoile = c => (x, y, t) => {
  let p = "";
  for (let k = 0; k < 10; k++) {
    const a = Math.PI / 5 * k - Math.PI / 2, r = k % 2 ? t * 0.45 : t;
    p += `${x + r * Math.cos(a)},${y + r * Math.sin(a)} `;
  }
  return `<polygon points="${p}" fill="${c}"/>`;
};
const poisson = c => (x, y, t) =>
  `<ellipse cx="${x}" cy="${y}" rx="${t}" ry="${t * 0.55}" fill="${c}"/><polygon points="${x + t * 0.8},${y} ${x + t * 1.5},${y - t * 0.55} ${x + t * 1.5},${y + t * 0.55}" fill="${c}"/>`;

// Une patte
function patte(x, y, t, couleur) {
  return `<ellipse cx="${x}" cy="${y}" rx="${t}" ry="${t * 0.72}" fill="${couleur}"/>
    <path d="M${x - t * 0.3} ${y + t * 0.15} v${t * 0.45} M${x + t * 0.3} ${y + t * 0.15} v${t * 0.45}" stroke="rgba(0,0,0,0.25)" stroke-width="${t * 0.12}" stroke-linecap="round"/>`;
}

// La tête de chat, réglable (couleur, yeux, langue…)
function tete(o) {
  const { cx, cy, r, poil, rayures = null, oreille = "#ffb8c6", yeux = "ouverts",
          iris = null, langue = false, trait = "#2a1c14", museau = "#fff8f0",
          tache = null, oreilleDroite = null } = o;
  let s = "";
  const oreilleSvg = (sens, couleur) => {
    const p = [[cx + sens * r * 0.92, cy - r * 0.25], [cx + sens * r * 0.78, cy - r * 1.2], [cx + sens * r * 0.16, cy - r * 0.78]];
    const q = [[cx + sens * r * 0.78, cy - r * 0.38], [cx + sens * r * 0.72, cy - r * 1.0], [cx + sens * r * 0.32, cy - r * 0.76]];
    return `<polygon points="${p.join(" ")}" fill="${couleur}" stroke="${couleur}" stroke-width="${r * 0.1}" stroke-linejoin="round"/>
            <polygon points="${q.join(" ")}" fill="${oreille}"/>`;
  };
  s += oreilleSvg(-1, poil) + oreilleSvg(1, oreilleDroite || poil);
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r * 0.88}" fill="${poil}"/>`;
  if (tache) s += `<ellipse cx="${cx + r * 0.42}" cy="${cy - r * 0.4}" rx="${r * 0.38}" ry="${r * 0.3}" fill="${tache}"/>`;
  if (rayures) {
    s += `<ellipse cx="${cx}" cy="${cy - r * 0.66}" rx="${r * 0.06}" ry="${r * 0.15}" fill="${rayures}"/>
          <ellipse cx="${cx - r * 0.2}" cy="${cy - r * 0.6}" rx="${r * 0.05}" ry="${r * 0.12}" fill="${rayures}"/>
          <ellipse cx="${cx + r * 0.2}" cy="${cy - r * 0.6}" rx="${r * 0.05}" ry="${r * 0.12}" fill="${rayures}"/>
          <ellipse cx="${cx - r * 0.86}" cy="${cy + r * 0.05}" rx="${r * 0.13}" ry="${r * 0.045}" fill="${rayures}"/>
          <ellipse cx="${cx + r * 0.86}" cy="${cy + r * 0.05}" rx="${r * 0.13}" ry="${r * 0.045}" fill="${rayures}"/>`;
  }
  s += `<ellipse cx="${cx - r * 0.15}" cy="${cy + r * 0.32}" rx="${r * 0.2}" ry="${r * 0.16}" fill="${museau}"/>
        <ellipse cx="${cx + r * 0.15}" cy="${cy + r * 0.32}" rx="${r * 0.2}" ry="${r * 0.16}" fill="${museau}"/>`;
  s += `<circle cx="${cx - r * 0.62}" cy="${cy + r * 0.25}" r="${r * 0.12}" fill="#ff8fa6" opacity="0.5"/>
        <circle cx="${cx + r * 0.62}" cy="${cy + r * 0.25}" r="${r * 0.12}" fill="#ff8fa6" opacity="0.5"/>`;
  const oeil = (ex, ey, ferme) => {
    if (ferme) return `<path d="M${ex - r * 0.17} ${ey} q${r * 0.17} ${r * 0.16} ${r * 0.34} 0" stroke="${trait}" stroke-width="${r * 0.05}" fill="none" stroke-linecap="round"/>`;
    if (iris) return `<ellipse cx="${ex}" cy="${ey}" rx="${r * 0.19}" ry="${r * 0.23}" fill="${iris}"/>
                      <ellipse cx="${ex}" cy="${ey}" rx="${r * 0.07}" ry="${r * 0.17}" fill="#111"/>
                      <circle cx="${ex + r * 0.06}" cy="${ey - r * 0.09}" r="${r * 0.05}" fill="#fff"/>`;
    return `<ellipse cx="${ex}" cy="${ey}" rx="${r * 0.17}" ry="${r * 0.21}" fill="#2a1c14"/>
            <circle cx="${ex + r * 0.05}" cy="${ey - r * 0.08}" r="${r * 0.065}" fill="#fff"/>
            <circle cx="${ex - r * 0.06}" cy="${ey + r * 0.08}" r="${r * 0.03}" fill="#fff"/>`;
  };
  const ey = cy - r * 0.05;
  s += oeil(cx - r * 0.4, ey, yeux === "fermes");
  s += oeil(cx + r * 0.4, ey, yeux === "fermes" || yeux === "clin");
  if (langue) s += `<path d="M${cx - r * 0.09} ${cy + r * 0.33} q0 ${r * 0.2} ${r * 0.09} ${r * 0.2} q${r * 0.09} 0 ${r * 0.09} -${r * 0.2}Z" fill="#ff6f91"/>`;
  s += `<path d="M${cx - r * 0.08} ${cy + r * 0.17} L${cx + r * 0.08} ${cy + r * 0.17} L${cx} ${cy + r * 0.26}Z" fill="#ff7f9a" stroke="#ff7f9a" stroke-width="${r * 0.03}" stroke-linejoin="round"/>`;
  s += `<path d="M${cx} ${cy + r * 0.26} q-${r * 0.06} ${r * 0.1} -${r * 0.16} ${r * 0.05} M${cx} ${cy + r * 0.26} q${r * 0.06} ${r * 0.1} ${r * 0.16} ${r * 0.05}" stroke="${trait}" stroke-width="${r * 0.03}" fill="none" stroke-linecap="round"/>`;
  for (const sens of [-1, 1]) {
    s += `<path d="M${cx + sens * r * 0.38} ${cy + r * 0.27} L${cx + sens * r * 1.12} ${cy + r * 0.15} M${cx + sens * r * 0.38} ${cy + r * 0.34} L${cx + sens * r * 1.12} ${cy + r * 0.4}" stroke="${trait}" stroke-width="${r * 0.02}" opacity="0.55" stroke-linecap="round"/>`;
  }
  return s;
}

const svg = contenu => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="800" height="800">${contenu}</svg>`;

// Les 6 images
const DESSINS = [
  {
    nom: "Le chaton surprise",
    svg: svg(`
      <rect width="400" height="400" fill="#ffd3e0"/>
      ${semer(coeur("#ffffff"), 11, 9)}
      <polygon points="95,250 130,205 270,205 305,250" fill="#a86d39"/>
      ${tete({ cx: 200, cy: 185, r: 82, poil: "#f5a04a", rayures: "#d9762a" })}
      <rect x="70" y="245" width="260" height="155" fill="#d4924f"/>
      <rect x="70" y="245" width="260" height="14" fill="#b97a3d"/>
      <polygon points="70,245 20,212 62,196 104,245" fill="#c4843f"/>
      <polygon points="330,245 380,212 338,196 296,245" fill="#c4843f"/>
      ${patte(158, 250, 22, "#f5a04a")}${patte(242, 250, 22, "#f5a04a")}
      <text x="200" y="335" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#c0392b" text-anchor="middle" transform="rotate(-6 200 335)">FRAGILE</text>
      <text x="200" y="375" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#8a5a2b" text-anchor="middle">↑ ce côté vers le haut ↑</text>
    `)
  },
  {
    nom: "Le professeur",
    svg: svg(`
      <rect width="400" height="400" fill="#cfe5ff"/>
      ${semer(rond("#ffffff"), 23, 6)}
      <text x="22" y="52" font-family="Georgia, serif" font-size="30" fill="#5f8fd0">1+1=2</text>
      <text x="300" y="52" font-family="Georgia, serif" font-size="30" fill="#5f8fd0">A B C</text>
      <text x="20" y="250" font-family="Georgia, serif" font-size="34" fill="#5f8fd0">π</text>
      <text x="350" y="260" font-family="Georgia, serif" font-size="34" fill="#5f8fd0">?</text>
      <ellipse cx="200" cy="395" rx="140" ry="110" fill="#a7b0bb"/>
      <ellipse cx="200" cy="380" rx="70" ry="70" fill="#eef0f3"/>
      ${tete({ cx: 200, cy: 195, r: 100, poil: "#a7b0bb", rayures: "#7f8996" })}
      <circle cx="160" cy="190" r="34" fill="#ffffff" fill-opacity="0.25" stroke="#2b2b2b" stroke-width="7"/>
      <circle cx="240" cy="190" r="34" fill="#ffffff" fill-opacity="0.25" stroke="#2b2b2b" stroke-width="7"/>
      <path d="M193 186 q7 -9 14 0" stroke="#2b2b2b" stroke-width="7" fill="none"/>
      <path d="M126 184 L100 172 M274 184 L300 172" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
      <polygon points="200,300 158,278 158,322" fill="#e63946"/>
      <polygon points="200,300 242,278 242,322" fill="#e63946"/>
      <circle cx="200" cy="300" r="11" fill="#b5202c"/>
    `)
  },
  {
    nom: "Bonne nuit",
    svg: svg(`
      <rect width="400" height="400" fill="#38336b"/>
      ${semer(etoile("#fff3b0"), 37, 7)}
      <circle cx="330" cy="70" r="40" fill="#ffe08a"/>
      <circle cx="347" cy="56" r="35" fill="#38336b"/>
      <ellipse cx="200" cy="340" rx="180" ry="60" fill="#e66f8c"/>
      <ellipse cx="200" cy="322" rx="168" ry="42" fill="#f28aa3"/>
      <ellipse cx="228" cy="285" rx="125" ry="62" fill="#f3e7d9"/>
      <ellipse cx="268" cy="262" rx="52" ry="30" fill="#c9a57f"/>
      <path d="M342 300 q28 42 -42 50 q-80 8 -140 -12" stroke="#f3e7d9" stroke-width="26" stroke-linecap="round" fill="none"/>
      ${tete({ cx: 135, cy: 258, r: 68, poil: "#f3e7d9", yeux: "fermes", oreilleDroite: "#c9a57f" })}
      ${patte(180, 320, 17, "#f3e7d9")}
      <text x="205" y="175" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff">z</text>
      <text x="235" y="140" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff">Z</text>
      <text x="275" y="100" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#ffffff" opacity="0.9">Z</text>
    `)
  },
  {
    nom: "La pelote",
    svg: svg(`
      <rect width="400" height="400" fill="#ffe680"/>
      ${semer(rond("#ffcf3a"), 51, 9)}
      <path d="M240 365 q72 -8 62 -95" stroke="#2d2c36" stroke-width="22" stroke-linecap="round" fill="none"/>
      <ellipse cx="160" cy="330" rx="105" ry="90" fill="#2d2c36"/>
      ${tete({ cx: 160, cy: 190, r: 90, poil: "#2d2c36", oreille: "#ff9eb5", iris: "#c6e94b", trait: "#e8e8e8", museau: "#3e3d4a" })}
      <path d="M255 300 C300 250 360 390 330 335" stroke="#3f8fd6" stroke-width="4" fill="none"/>
      <circle cx="310" cy="330" r="58" fill="#4fa3e0"/>
      <path d="M268 300 q42 20 84 0 M258 330 q52 26 104 0 M272 364 q38 13 76 0 M292 276 q-22 52 10 110 M330 276 q22 52 -6 110" stroke="#9fd2f5" stroke-width="5" fill="none" stroke-linecap="round"/>
      ${patte(250, 298, 24, "#2d2c36")}
      <circle cx="243" cy="301" r="5" fill="#ff9eb5"/><circle cx="257" cy="301" r="5" fill="#ff9eb5"/>
    `)
  },
  {
    nom: "Mlem !",
    svg: svg(`
      <rect width="400" height="400" fill="#c9f2c7"/>
      ${semer(poisson("#a3e09f"), 67, 12)}
      <text x="200" y="48" font-family="Arial, sans-serif" font-size="40" font-weight="900" fill="#3b8f3a" text-anchor="middle">MLEM !</text>
      <ellipse cx="200" cy="405" rx="150" ry="100" fill="#fff3e3"/>
      <ellipse cx="275" cy="370" rx="60" ry="42" fill="#f2a65a"/>
      ${tete({ cx: 200, cy: 210, r: 115, poil: "#fff3e3", yeux: "clin", langue: true, tache: "#f2a65a", oreilleDroite: "#f2a65a" })}
    `)
  },
  {
    nom: "Sa Majesté",
    svg: svg(`
      <rect width="400" height="400" fill="#ff8f84"/>
      ${semer(etoile("#ffd24d"), 89, 9)}
      <path d="M30 400 Q200 170 370 400Z" fill="#b3123c"/>
      <ellipse cx="200" cy="400" rx="120" ry="92" fill="#ffffff"/>
      <ellipse cx="200" cy="318" rx="118" ry="20" fill="#ffffff"/>
      <circle cx="140" cy="318" r="4" fill="#222"/><circle cx="180" cy="322" r="4" fill="#222"/>
      <circle cx="220" cy="322" r="4" fill="#222"/><circle cx="260" cy="318" r="4" fill="#222"/>
      ${tete({ cx: 200, cy: 215, r: 95, poil: "#ffffff", iris: "#5bb3e8", museau: "#f4f4f8" })}
      <polygon points="150,142 150,96 174,116 200,80 226,116 250,96 250,142" fill="#ffcc33" stroke="#e0a800" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="150" cy="94" r="7" fill="#ffcc33"/><circle cx="200" cy="78" r="7" fill="#ffcc33"/><circle cx="250" cy="94" r="7" fill="#ffcc33"/>
      <circle cx="175" cy="129" r="7" fill="#e63946"/><circle cx="200" cy="126" r="8" fill="#3a86ff"/><circle cx="225" cy="129" r="7" fill="#2ec27e"/>
    `)
  }
];

// Transforme chaque dessin en image utilisable
DESSINS.forEach(d => d.url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(d.svg));


/* =========================================================
   2. LE JEU
   ========================================================= */

const NIVEAUX = { enfant: 3, adulte: 5 };
let niveau = "enfant", taille = 3, image = null, nomImage = "";
let ordre = [];          // ordre[case] = numéro de la pièce posée dans cette case
let choisie = null, departGlisse = null;
let coups = 0, debut = 0, chrono = null, fini = false;

const $ = id => document.getElementById(id);

function afficherEcran(id) {
  document.querySelectorAll(".ecran").forEach(e => e.classList.remove("visible"));
  $(id).classList.add("visible");
  window.scrollTo(0, 0);
}

// Meilleurs scores, gardés dans le navigateur
function lireRecord(cle) {
  try { return JSON.parse(localStorage.getItem("puzzle-chats-" + cle)); } catch (e) { return null; }
}
function ecrireRecord(cle, valeur) {
  try { localStorage.setItem("puzzle-chats-" + cle, JSON.stringify(valeur)); } catch (e) {}
}

// --- Galerie ---
function construireGalerie() {
  const g = $("galerie");
  g.innerHTML = "";
  DESSINS.forEach(d => {
    const rec = lireRecord(niveau + "-" + d.nom);
    const v = document.createElement("div");
    v.className = "vignette";
    v.innerHTML = `<img src="${d.url}" alt="${d.nom}"><p>${d.nom}<br><span class="record">${rec ? "🏆 " + rec.coups + " coups" : "&nbsp;"}</span></p>`;
    v.onclick = () => lancer(d.url, d.nom);
    g.appendChild(v);
  });
  const p = document.createElement("div");
  p.className = "vignette photo";
  p.innerHTML = `<span class="emoji">📷</span><p>Ta photo de chat</p>`;
  p.onclick = () => $("fichier-photo").click();
  g.appendChild(p);
}

// Photo perso : on la recadre en carré
$("fichier-photo").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const lecteur = new FileReader();
  lecteur.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = Math.min(img.width, img.height);
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 800;
      canvas.getContext("2d").drawImage(img, (img.width - c) / 2, (img.height - c) / 2, c, c, 0, 0, 800, 800);
      lancer(canvas.toDataURL("image/jpeg", 0.9), "Ta photo");
    };
    img.src = lecteur.result;
  };
  lecteur.readAsDataURL(f);
  e.target.value = "";
});

// --- Démarrer une partie ---
function lancer(url, nom) {
  image = url;
  nomImage = nom;
  $("modele").style.backgroundImage = `url("${url}")`;
  $("modele").classList.remove("visible");
  $("btn-modele").textContent = "👀 Voir le modèle";
  melanger();
  afficherEcran("ecran-jeu");
}

function melanger() {
  const n = taille * taille;
  ordre = [...Array(n).keys()];
  do {
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ordre[i], ordre[j]] = [ordre[j], ordre[i]];
    }
  } while (ordre.filter((p, i) => p === i).length > Math.floor(n / 5)); // peu de pièces déjà bien placées
  choisie = null;
  coups = 0;
  fini = false;
  $("coups").textContent = 0;
  $("temps").textContent = "0:00";
  clearInterval(chrono);
  debut = Date.now();
  chrono = setInterval(() => $("temps").textContent = formatTemps(Date.now() - debut), 500);
  dessinerPlateau();
}

function formatTemps(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

// --- Dessiner le plateau ---
function dessinerPlateau() {
  const plateau = $("plateau");
  plateau.style.gridTemplateColumns = `repeat(${taille}, 1fr)`;
  plateau.innerHTML = "";
  ordre.forEach((piece, caseNum) => {
    const d = document.createElement("div");
    d.className = "piece";
    d.dataset.case = caseNum;
    const col = piece % taille, lig = Math.floor(piece / taille);
    d.style.backgroundImage = `url("${image}")`;
    d.style.backgroundSize = `${taille * 100}% ${taille * 100}%`;
    d.style.backgroundPosition = `${col / (taille - 1) * 100}% ${lig / (taille - 1) * 100}%`;
    if (caseNum === choisie) d.classList.add("choisie");
    if (niveau === "enfant" && piece === caseNum) d.classList.add("bien");
    plateau.appendChild(d);
  });
}

function echanger(a, b) {
  [ordre[a], ordre[b]] = [ordre[b], ordre[a]];
  coups++;
  $("coups").textContent = coups;
  dessinerPlateau();
  if (ordre.every((p, i) => p === i)) gagner();
}

// --- Toucher / cliquer / glisser ---
const pieceSous = e => {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return el && el.closest(".piece") ? +el.closest(".piece").dataset.case : null;
};

$("plateau").addEventListener("pointerdown", e => {
  if (fini) return;
  const c = pieceSous(e);
  if (c === null) return;
  e.preventDefault();
  departGlisse = c;
});

document.addEventListener("pointermove", e => {
  if (departGlisse === null) return;
  document.querySelectorAll(".piece.cible").forEach(p => p.classList.remove("cible"));
  const c = pieceSous(e);
  if (c !== null && c !== departGlisse) $("plateau").children[c].classList.add("cible");
});

document.addEventListener("pointerup", e => {
  if (departGlisse === null) return;
  const arrivee = pieceSous(e);
  const depart = departGlisse;
  departGlisse = null;
  if (arrivee !== null && arrivee !== depart) {
    // On a fait glisser une pièce sur une autre
    choisie = null;
    echanger(depart, arrivee);
  } else if (arrivee === depart) {
    // Simple toucher : on sélectionne, puis on échange au deuxième toucher
    if (choisie === null) choisie = depart;
    else if (choisie === depart) choisie = null;
    else { const a = choisie; choisie = null; echanger(a, depart); return; }
    dessinerPlateau();
  } else {
    dessinerPlateau();
  }
});

// --- Victoire ---
function gagner() {
  fini = true;
  clearInterval(chrono);
  const duree = Date.now() - debut;
  const n = taille * taille;
  const nbEtoiles = coups <= n ? 3 : coups <= n * 2 ? 2 : 1;
  $("etoiles").textContent = "⭐".repeat(nbEtoiles) + "☆".repeat(3 - nbEtoiles);
  $("image-gagnee").src = image;

  let texte = `Tu as réussi en <strong>${coups} coups</strong> et <strong>${formatTemps(duree)}</strong>.`;
  if (nomImage !== "Ta photo") {
    const cle = niveau + "-" + nomImage;
    const rec = lireRecord(cle);
    if (!rec || coups < rec.coups) {
      ecrireRecord(cle, { coups, temps: duree });
      if (rec) texte += "<br>🏆 Nouveau record !";
    } else {
      texte += `<br>Ton record : ${rec.coups} coups.`;
    }
  }
  $("bilan").innerHTML = texte;
  setTimeout(() => { $("victoire").classList.add("visible"); confettis(); }, 350);
}

function confettis() {
  const motifs = ["🎉", "✨", "🐾", "⭐", "💖", "🐟"];
  for (let i = 0; i < 45; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    c.textContent = motifs[i % motifs.length];
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = 2 + Math.random() * 2.5 + "s";
    c.style.animationDelay = Math.random() * 0.8 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}

// --- Boutons ---
document.querySelectorAll(".niveau").forEach(b => b.onclick = () => {
  niveau = b.dataset.niveau;
  taille = NIVEAUX[niveau];
  construireGalerie();
  afficherEcran("ecran-galerie");
});
$("retour-accueil").onclick = () => afficherEcran("ecran-accueil");
$("btn-galerie").onclick = () => { clearInterval(chrono); construireGalerie(); afficherEcran("ecran-galerie"); };
$("btn-melanger").onclick = melanger;
$("btn-modele").onclick = () => {
  const m = $("modele");
  m.classList.toggle("visible");
  $("btn-modele").textContent = m.classList.contains("visible") ? "🧩 Revenir au puzzle" : "👀 Voir le modèle";
};
$("modele").onclick = () => $("btn-modele").click();
$("btn-rejouer").onclick = () => { $("victoire").classList.remove("visible"); melanger(); };
$("btn-autre").onclick = () => { $("victoire").classList.remove("visible"); construireGalerie(); afficherEcran("ecran-galerie"); };
</script>

</body>
